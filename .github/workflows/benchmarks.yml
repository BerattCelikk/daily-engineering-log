name: "Concurrency & Architecture Benchmarks"

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Concurrency Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run Concurrency Benchmarks
      run: |
        chmod +x benchmarks/run_benchmarks.sh
        bash benchmarks/run_benchmarks.sh
