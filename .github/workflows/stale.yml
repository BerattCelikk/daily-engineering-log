name: "Issue & PR Lifecycle Management"

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been automatically marked as stale due to inactivity. It will be closed in 7 days if no further action occurs. Maintainers may add `lifecycle/frozen` to prevent closure.'
        stale-pr-message: 'This pull request has been automatically marked as stale due to inactivity. It will be closed in 7 days if no updates are made.'
        stale-issue-label: 'lifecycle/stale'
        stale-pr-label: 'lifecycle/stale'
        exempt-issue-labels: 'lifecycle/frozen,good-first-issue,help-wanted,type/rfc'
        exempt-pr-labels: 'lifecycle/frozen'
        days-before-stale: 30
        days-before-close: 7
