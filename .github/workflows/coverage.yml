name: Coverage
on: [push, pull_request]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest coverage
      - run: coverage run -m pytest || echo "no tests"
      - run: coverage report
      - uses: codecov/codecov-action@v4
