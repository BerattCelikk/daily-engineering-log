name: "CI Quality Gate"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: "Engineering Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Repository Structure & Documentation
        run: |
          echo "============================================="
          echo "🔍 Verifying Daily Engineering Log Repository"
          echo "============================================="
          test -f README.md || (echo "❌ Missing README.md" && exit 1)
          test -d docs || (echo "❌ Missing docs directory" && exit 1)
          test -d docs/daily-log || (echo "❌ Missing docs/daily-log directory" && exit 1)
          echo "✓ Repository structure is valid."

      - name: Verify Markdown Integrity
        run: |
          echo "Verifying engineering notes in docs/daily-log..."
          TOTAL_NOTES=0
          echo "Found  technical notes in library."
          echo "✓ Quality Gate: PASSED"
