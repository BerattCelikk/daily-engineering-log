// Archived from Gist: https://gist.github.com/BerattCelikk/e934b4358057b5089189b1da9db11ae2
// Topic: GitHub Actions Dependency Cache Optimization
// Date: 2026-09-27

- name: Cache Go modules
  uses: actions/cache@v4
  with:
    path: ~/go/pkg/mod
    key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    restore-keys: |
      ${{ runner.os }}-go-
