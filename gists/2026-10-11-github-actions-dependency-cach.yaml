// Archived from Gist: https://gist.github.com/BerattCelikk/b0711a60dd1b67494d1d3666bbd64a70
// Topic: GitHub Actions Dependency Cache Optimization
// Date: 2026-10-11

- name: Cache Go modules
  uses: actions/cache@v4
  with:
    path: ~/go/pkg/mod
    key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    restore-keys: |
      ${{ runner.os }}-go-
