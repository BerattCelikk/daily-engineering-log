// Archived from Gist: https://gist.github.com/BerattCelikk/46b5a422fa70856de3710f1fc863a7f3
// Topic: GitHub Actions Dependency Cache Optimization
// Date: 2026-11-15

- name: Cache Go modules
  uses: actions/cache@v4
  with:
    path: ~/go/pkg/mod
    key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    restore-keys: |
      ${{ runner.os }}-go-
