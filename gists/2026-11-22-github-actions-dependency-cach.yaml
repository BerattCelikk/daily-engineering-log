// Archived from Gist: https://gist.github.com/BerattCelikk/e06ab7a01702b81b2b3e4aa4b49edaa3
// Topic: GitHub Actions Dependency Cache Optimization
// Date: 2026-11-22

- name: Cache Go modules
  uses: actions/cache@v4
  with:
    path: ~/go/pkg/mod
    key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    restore-keys: |
      ${{ runner.os }}-go-
